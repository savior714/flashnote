version: '3'

vars:
  APP_NAME: flashnote
  BIN_DIR: bin
  PACKAGE_MANAGER: pnpm

includes:
  darwin: ./build/darwin/Taskfile.yml

tasks:
  prepare:icon:
    summary: Seeds Wails icon staging from the durable selected source
    internal: true
    cmds:
      - cp assets/appicon.png build/appicon.png
      - rm -rf build/appicon.icon build/darwin/Assets.car
      # `generate build-assets` rewrites the derived icons behind go-task's
      # back, leaving a stale up-to-date fingerprint; drop the derived
      # outputs so common:generate:icons always re-derives from canonical.
      - rm -f build/darwin/icons.icns build/windows/icon.ico

  package:macos:
    summary: Packages the production macOS app bundle for release acceptance
    deps: [prepare:icon]
    cmds:
      - task: darwin:package

  package:macos:dmg:
    summary: Packages the production macOS DMG for release acceptance
    deps: [prepare:icon]
    cmds:
      - task: darwin:package:dmg

  package:macos:universal:
    summary: Packages a universal macOS app bundle for private cross-Mac use
    deps: [prepare:icon]
    cmds:
      - task: darwin:package:universal

  package:macos:universal:dmg:
    summary: Packages a universal macOS DMG for private cross-Mac use
    deps: [prepare:icon]
    cmds:
      - task: darwin:package:universal:dmg

  # The release tag is the version authority. CI stamps the build assets from
  # it before packaging so the DMG, the .app, the executable's file version and
  # the installer all report the same number.
  stamp:version:
    summary: Stamps one release version into every shipped build asset
    cmds:
      - node scripts/stamp-release-version.mjs {{.VERSION}}

  # Windows packaging owns a script rather than a Taskfile: the same commands
  # have to run under Git Bash on Windows and on macOS/Linux, and go-task's
  # shell abstractions are the one thing that differs between those hosts.
  package:windows:
    summary: Packages the Windows executables and the per-user NSIS installer
    env:
      VERSION: '{{.VERSION | default "0.1.0"}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "user"}}'
    cmds:
      - bash ./scripts/package-windows-release.sh
