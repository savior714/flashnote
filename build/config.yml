version: '3'

info:
  companyName: "Flashnote"
  productName: "Flashnote"
  productIdentifier: "com.flashnote.app"
  description: "A lightweight local-first document note app"
  copyright: ""
  comments: ""
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
    file:
      - .DS_Store
      - .gitignore
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task frontend:install
      type: once
    - cmd: wails3 task frontend:dev
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

fileAssociations:

other:
