version: '3'

vars:
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  frontend:install:
    dir: frontend
    sources:
      - package.json
    generates:
      - node_modules/**/*
    cmds:
      - corepack pnpm install

  bindings:
    deps: [frontend:install]
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -clean=true -ts

  frontend:check:
    deps: [bindings]
    dir: frontend
    cmds:
      - corepack pnpm check

  frontend:build:
    deps: [bindings]
    dir: frontend
    cmds:
      - corepack pnpm build

  frontend:dev:
    deps: [frontend:install]
    dir: frontend
    cmds:
      - corepack pnpm dev

  go:check:
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
    cmds:
      - go test ./... 2>&1 | grep -v "was built for newer"
      - go vet ./...

  check:
    deps: [frontend:check, go:check]

  build:
    deps: [frontend:build]
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
    cmds:
      - go build . 2>&1 | grep -v "was built for newer"

  run:
    deps: [frontend:build]
    cmds:
      - go run .

  dev:
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  e2e:headless:
    desc: Run isolated Wails server-mode E2E without opening a native window
    cmds:
      - corepack pnpm --dir frontend install --frozen-lockfile
      - corepack pnpm --dir frontend build
      - corepack pnpm --dir e2e install --frozen-lockfile
      - corepack pnpm --dir e2e exec playwright install chromium
      - ./scripts/run-headless-e2e.sh
