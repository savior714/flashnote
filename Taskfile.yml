version: '3'

vars:
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  APP_NAME: flashnote
  BIN_DIR: bin

includes:
  darwin: ./build/darwin/Taskfile.yml

tasks:
  frontend:install:
    dir: frontend
    sources:
      - package.json
    generates:
      - node_modules/**/*
    cmds:
      - corepack pnpm install

  bindings:
    deps: [frontend:install]
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -clean=true -ts

  frontend:check:
    deps: [bindings]
    dir: frontend
    cmds:
      - corepack pnpm check

  frontend:build:
    deps: [bindings]
    dir: frontend
    cmds:
      - corepack pnpm build

  frontend:dev:
    deps: [frontend:install]
    dir: frontend
    cmds:
      - corepack pnpm dev

  go:check:
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
    cmds:
      - go test ./... 2>&1 | grep -v "was built for newer"
      - go vet ./...

  check:
    deps: [frontend:check, go:check]

  build:
    deps: [frontend:build]
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
    cmds:
      - go build . 2>&1 | grep -v "was built for newer"

  # The ordinary user-facing launch path (Flashnote.command). On macOS it must
  # never terminate in a bare `go run .`: the running process needs a real
  # `.app` bundle context (Info.plist + Resources/icons.icns) so macOS owns the
  # app identity and Dock artwork. This reuses the canonical Wails Darwin dev-app
  # bundle/run machinery in build/darwin instead of bespoke packaging.
  run:
    summary: Runs Flashnote as a real macOS .app bundle via the canonical Wails Darwin dev-app path
    platforms: [darwin]
    deps: [frontend:build, run:icons]
    cmds:
      # Sequential after frontend:build: the binary embeds frontend/dist via go:embed.
      - task: run:binary
      - task: darwin:run

  run:binary:
    internal: true
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o "{{.BIN_DIR}}/{{.APP_NAME}}" . 2>&1 | grep -v "was built for newer"

  run:icons:
    internal: true
    status:
      - test -f darwin/icons.icns
    cmds:
      # Seeds icon staging only when missing, derived deterministically from the canonical artwork.
      - cp ../assets/appicon.png appicon.png
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns
    dir: build

  dev:
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
