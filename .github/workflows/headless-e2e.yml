name: Headless E2E

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wails-server-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Run isolated headless E2E
        run: ./scripts/run-headless-e2e.sh

      - name: Upload headless E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            .artifacts/headless-e2e/**
            e2e/test-results/**
            e2e/playwright-report/**