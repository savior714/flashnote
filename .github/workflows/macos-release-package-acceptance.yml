name: macOS release package acceptance

# Personal-use mode: distribution evidence is manual-only until explicitly reopened.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-release-package:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run canonical macOS package acceptance
        run: |
          FLASHNOTE_PACKAGE_EVIDENCE_DIR="$RUNNER_TEMP/release-package-evidence" ./scripts/accept-macos-release-package.sh

      - name: Upload package acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-package-${{ github.sha }}
          path: ${{ runner.temp }}/release-package-evidence/
          if-no-files-found: error
          retention-days: 14
