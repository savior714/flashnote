name: Native scaffold acceptance

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  macos-native-scaffold:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Publish pending acceptance status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=native-scaffold-acceptance \
            -f description="Native scaffold acceptance running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Toolchain diagnostics
        run: |
          set -euo pipefail
          go version
          node --version
          xcode-select -p
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails3" version

      - name: Resolve candidate dependencies
        run: |
          set -euo pipefail
          go mod tidy
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm add --save-dev --save-exact @types/node@24.13.3
          cd ..
          test -s go.sum
          test -s frontend/pnpm-lock.yaml

      - name: Generate bindings
        run: |
          set -euo pipefail
          wails3 generate bindings -clean=true -ts
          test -f frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function GetRuntimeInfo' frontend/bindings/github.com/savior714/flashnote/appservice.ts

      - name: Stage validated source candidate
        run: |
          set -euo pipefail
          python3 scripts/stage_native_acceptance_candidate.py
          gofmt -w app_service.go

      - name: Static checks
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -not -path './frontend/*' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
          go test ./...
          go vet ./...
          cd frontend
          pnpm check
          pnpm build
          cd ..
          wails3 task check

      - name: Wails build
        run: |
          set -euo pipefail
          wails3 build
          test -x ./flashnote

      - name: First native startup and frontend bridge
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          mkdir -p "$HOME"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG="$RUNNER_TEMP/flashnote-first.log"
          ./flashnote >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if [[ -f "$DB" ]] && grep -q FLASHNOTE_RUNTIME_READY "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          test -f "$DB"
          kill -0 "$pid"
          grep -q 'Handling request url=/assets/.*\.js' "$LOG"
          grep -q 'Handling request url=/assets/.*\.css' "$LOG"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          sqlite3 "$DB" 'SELECT version FROM schema_migrations ORDER BY version;'
          sqlite3 "$DB" 'SELECT name FROM sqlite_master WHERE type="table" ORDER BY name;'
          cp "$LOG" "$RUNNER_TEMP/first-startup.log"
          cleanup
          trap - EXIT

      - name: Wails dev smoke
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-dev-home"
          mkdir -p "$HOME"
          LOG="$RUNNER_TEMP/wails-dev.log"
          wails3 dev -config ./build/config.yml -port 9245 >"$LOG" 2>&1 &
          pid=$!
          cleanup() {
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..90}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          curl --fail --silent --show-error http://127.0.0.1:9245/ | grep -q '<div id="app"></div>'
          cp "$LOG" "$RUNNER_TEMP/wails-dev.log.saved"
          cleanup
          trap - EXIT

      - name: SQLite runtime probe
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          mkdir -p internal/acceptanceprobe
          cat > internal/acceptanceprobe/main.go <<'PROBE'
          package main

          import (
            "context"
            "encoding/json"
            "fmt"
            "github.com/savior714/flashnote/internal/appdata"
            "github.com/savior714/flashnote/internal/persistence"
          )

          func main() {
            path, err := appdata.DatabasePath()
            if err != nil { panic(err) }
            store, err := persistence.Open(context.Background(), path)
            if err != nil { panic(err) }
            defer store.Close()
            info, err := store.RuntimeInfo(context.Background())
            if err != nil { panic(err) }
            data, err := json.Marshal(info)
            if err != nil { panic(err) }
            fmt.Println(string(data))
          }
          PROBE
          go run ./internal/acceptanceprobe | tee "$RUNNER_TEMP/sqlite-runtime.json"
          rm -rf internal/acceptanceprobe

      - name: Second native startup
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG="$RUNNER_TEMP/flashnote-second.log"
          before="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')"
          ./flashnote >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          kill -0 "$pid"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          after="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')"
          test "$before" = "$after"
          test "$after" = 1
          cp "$LOG" "$RUNNER_TEMP/second-startup.log"
          cleanup
          trap - EXIT

      - name: Prepare exact publication tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/29f138518a18981a9c4f2909418dbce0dd0160cd" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/verify-candidate.py"
          python3 "$RUNNER_TEMP/verify-candidate.py"
          git add Taskfile.yml app_service.go go.sum frontend/package.json frontend/pnpm-lock.yaml frontend/src/App.svelte frontend/bindings
          git rm scripts/stage_native_acceptance_candidate.py
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            Taskfile.yml \
            app_service.go \
            frontend/bindings/github.com/savior714/flashnote/appservice.ts \
            frontend/bindings/github.com/savior714/flashnote/index.ts \
            frontend/bindings/github.com/savior714/flashnote/models.ts \
            frontend/bindings/github.com/wailsapp/wails/v3/internal/eventcreate.ts \
            frontend/bindings/github.com/wailsapp/wails/v3/internal/eventdata.d.ts \
            frontend/package.json \
            frontend/pnpm-lock.yaml \
            frontend/src/App.svelte \
            go.sum \
            scripts/stage_native_acceptance_candidate.py | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Publish exact candidate FF-only
        id: publish
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close native scaffold acceptance"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin HEAD:main
          echo "candidate=$candidate" | tee "$RUNNER_TEMP/published-candidate.txt"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Post-publication exact commit acceptance
        run: |
          set -euo pipefail
          candidate="${{ steps.publish.outputs.candidate }}"
          test -n "$candidate"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse origin/main)" = "$candidate"

          git clean -fdx
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          cd frontend
          pnpm install --frozen-lockfile
          cd ..
          wails3 generate bindings -clean=true -ts
          git diff --exit-code -- frontend/bindings

          unformatted="$(find . -type f -name '*.go' -not -path './frontend/*' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
          go test ./...
          go vet ./...
          cd frontend
          pnpm check
          pnpm build
          cd ..
          wails3 task check
          wails3 build
          test -x ./flashnote

          export HOME="$RUNNER_TEMP/postpublish-home"
          mkdir -p "$HOME"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG1="$RUNNER_TEMP/postpublish-first.log"
          ./flashnote >"$LOG1" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if [[ -f "$DB" ]] && grep -q FLASHNOTE_RUNTIME_READY "$LOG1"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          test -f "$DB"
          kill -0 "$pid"
          grep -q 'Handling request url=/assets/.*\.js' "$LOG1"
          grep -q 'Handling request url=/assets/.*\.css' "$LOG1"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG1"
          test "$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')" = 1
          cleanup
          trap - EXIT

          LOG2="$RUNNER_TEMP/postpublish-second.log"
          ./flashnote >"$LOG2" 2>&1 &
          pid=$!
          trap cleanup EXIT
          for _ in {1..30}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$LOG2"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          kill -0 "$pid"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG2"
          test "$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')" = 1
          cleanup
          trap - EXIT

          export HOME="$RUNNER_TEMP/postpublish-dev-home"
          mkdir -p "$HOME"
          DEVLOG="$RUNNER_TEMP/postpublish-wails-dev.log"
          wails3 dev -config ./build/config.yml -port 9245 >"$DEVLOG" 2>&1 &
          pid=$!
          cleanup_dev() {
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup_dev EXIT
          for _ in {1..90}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$DEVLOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          grep -q FLASHNOTE_RUNTIME_READY "$DEVLOG"
          curl --fail --silent --show-error http://127.0.0.1:9245/ | grep -q '<div id="app"></div>'
          cleanup_dev
          trap - EXIT

          git diff --exit-code -- go.mod go.sum Taskfile.yml app_service.go frontend/package.json frontend/pnpm-lock.yaml frontend/src/App.svelte frontend/bindings
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$candidate"
          echo "postpublication_candidate=$candidate" | tee "$RUNNER_TEMP/postpublication-proof.txt"

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scaffold-publication-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/published-candidate.txt
            ${{ runner.temp }}/postpublication-proof.txt
            ${{ runner.temp }}/postpublish-first.log
            ${{ runner.temp }}/postpublish-second.log
            ${{ runner.temp }}/postpublish-wails-dev.log
            ${{ runner.temp }}/sqlite-runtime.json
            ${{ runner.temp }}/first-startup.log
            ${{ runner.temp }}/wails-dev.log.saved
            ${{ runner.temp }}/second-startup.log

      - name: Publish candidate acceptance status
        if: always() && steps.publish.outputs.candidate != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.publish.outputs.candidate }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="Published native scaffold acceptance failed"
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description="Published native scaffold acceptance passed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE" \
            -f state="$state" \
            -f context=native-scaffold-acceptance \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish acceptance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="Native scaffold acceptance failed"
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description="Native scaffold acceptance passed and published"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=native-scaffold-acceptance \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
