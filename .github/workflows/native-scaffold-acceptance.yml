name: Native scaffold acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  macos-native-scaffold:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Publish pending acceptance status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=native-scaffold-acceptance \
            -f description="Native scaffold acceptance running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Toolchain diagnostics
        run: |
          set -euo pipefail
          go version
          node --version
          xcode-select -p
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails3" version

      - name: Verify dependency metadata
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          cd frontend
          pnpm install --frozen-lockfile
          cd ..
          git diff --exit-code -- frontend/package.json frontend/pnpm-lock.yaml

      - name: Verify generated bindings
        run: |
          set -euo pipefail
          wails3 generate bindings -clean=true -ts
          test -f frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function GetRuntimeInfo' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function OpenInitialNote' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function SaveNote' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function SearchNotes' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function CreateFolder' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function ListFolderNotes' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function MoveNote' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function ListTrashNotes' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function MoveNoteToTrash' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function OpenTrashNote' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function RestoreNote' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function PermanentlyDeleteNote' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function ListTrashFolders' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function ListTrashFolderNotes' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function MoveFolderToTrash' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function RestoreFolder' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function PermanentlyDeleteFolder' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function TrashCounts' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function EmptyTrash' frontend/bindings/github.com/savior714/flashnote/appservice.ts
          git diff --exit-code -- frontend/bindings

      - name: Static checks
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -not -path './frontend/*' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
          go test ./...
          go vet ./...
          cd frontend
          pnpm check
          pnpm build
          cd ..
          wails3 task check

      - name: Wails build
        run: |
          set -euo pipefail
          wails3 build
          test -x ./flashnote
          cp ./flashnote "$RUNNER_TEMP/flashnote-normal"

      - name: First native startup and frontend bridge
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          mkdir -p "$HOME"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG="$RUNNER_TEMP/flashnote-first.log"
          ./flashnote >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if [[ -f "$DB" ]] && grep -q FLASHNOTE_RUNTIME_READY "$LOG" && grep -q FLASHNOTE_NOTE_OPEN "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          test -f "$DB"
          kill -0 "$pid"
          grep -q 'Handling request url=/assets/.*\.js' "$LOG"
          grep -q 'Handling request url=/assets/.*\.css' "$LOG"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          grep -q FLASHNOTE_NOTE_OPEN "$LOG"
          migrations="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')"
          test "$migrations" -ge 6
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='note_search';")" = 1
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='folders';")" = 1
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM pragma_table_info('notes') WHERE name='folder_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM pragma_table_info('notes') WHERE name='deleted_at';")" = 1
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM pragma_table_info('notes') WHERE name='deleted_with_folder_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM pragma_table_info('folders') WHERE name='deleted_at';")" = 1
          sqlite3 "$DB" 'SELECT version FROM schema_migrations ORDER BY version;'
          sqlite3 "$DB" 'SELECT name FROM sqlite_master WHERE type="table" ORDER BY name;'
          cp "$LOG" "$RUNNER_TEMP/first-startup.log"
          cleanup
          trap - EXIT

      - name: Wails dev smoke
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-dev-home"
          mkdir -p "$HOME"
          LOG="$RUNNER_TEMP/wails-dev.log"
          wails3 dev -config ./build/config.yml -port 9245 >"$LOG" 2>&1 &
          pid=$!
          cleanup() {
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..90}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$LOG" && grep -q FLASHNOTE_NOTE_OPEN "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          grep -q FLASHNOTE_NOTE_OPEN "$LOG"
          curl --fail --silent --show-error http://127.0.0.1:9245/ | grep -q '<div id="app"></div>'
          cp "$LOG" "$RUNNER_TEMP/wails-dev.log.saved"
          cleanup
          trap - EXIT

      - name: SQLite runtime probe
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          mkdir -p internal/acceptanceprobe
          cat > internal/acceptanceprobe/main.go <<'PROBE'
          package main

          import (
            "context"
            "encoding/json"
            "fmt"
            "github.com/savior714/flashnote/internal/appdata"
            "github.com/savior714/flashnote/internal/persistence"
          )

          func main() {
            path, err := appdata.DatabasePath()
            if err != nil { panic(err) }
            store, err := persistence.Open(context.Background(), path)
            if err != nil { panic(err) }
            defer store.Close()
            info, err := store.RuntimeInfo(context.Background())
            if err != nil { panic(err) }
            data, err := json.Marshal(info)
            if err != nil { panic(err) }
            fmt.Println(string(data))
          }
          PROBE
          go run ./internal/acceptanceprobe | tee "$RUNNER_TEMP/sqlite-runtime.json"
          rm -rf internal/acceptanceprobe

      - name: Second native startup
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG="$RUNNER_TEMP/flashnote-second.log"
          before="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')"
          note_id="$(sqlite3 "$DB" 'SELECT id FROM notes WHERE deleted_at IS NULL LIMIT 1;')"
          test -n "$note_id"
          ./flashnote >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$LOG" && grep -q "FLASHNOTE_NOTE_OPEN id=$note_id" "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          kill -0 "$pid"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          grep -q "FLASHNOTE_NOTE_OPEN id=$note_id" "$LOG"
          grep -q 'created=false' "$LOG"
          after="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')"
          test "$before" = "$after"
          cp "$LOG" "$RUNNER_TEMP/second-startup.log"
          cleanup
          trap - EXIT

      - name: Durable note round trip
        env:
          ACCEPTANCE_TEXT: Flashnote durable vertical slice
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-note-home"
          mkdir -p "$HOME"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG="$RUNNER_TEMP/note-roundtrip-first.log"

          rm -rf .task frontend/dist flashnote
          VITE_FLASHNOTE_ACCEPTANCE_TEXT="$ACCEPTANCE_TEXT" wails3 build
          test -x ./flashnote

          ./flashnote >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..90}; do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "acceptance app did not close after frontend flush" >&2
            cat "$LOG" >&2 || true
            exit 1
          fi
          wait "$pid"
          trap - EXIT

          test -f "$DB"
          grep -q FLASHNOTE_IMAGE_INGESTED "$LOG"
          grep -q FLASHNOTE_NOTE_CREATED "$LOG"
          grep -q FLASHNOTE_NOTE_SAVED "$LOG"
          grep -q FLASHNOTE_FOLDER_CREATED "$LOG"
          grep -q FLASHNOTE_NOTE_MOVED "$LOG"
          grep -q FLASHNOTE_NOTE_TRASHED "$LOG"
          grep -q FLASHNOTE_TRASH_NOTE_OPEN "$LOG"
          grep -q FLASHNOTE_NOTE_RESTORED "$LOG"
          grep -q FLASHNOTE_FOLDER_TRASHED "$LOG"
          grep -q FLASHNOTE_FOLDER_RESTORED "$LOG"
          ! grep -q FLASHNOTE_ACCEPTANCE_TRASH_FAILURE "$LOG"
          grep -q FLASHNOTE_CLOSE_FLUSH_REQUESTED "$LOG"
          grep -q FLASHNOTE_CLOSE_APPROVED "$LOG"
          ! grep -q FLASHNOTE_CLOSE_DISCARDED "$LOG"

          test "$(sqlite3 "$DB" 'SELECT COUNT(*) FROM notes;')" = 2
          test "$(sqlite3 "$DB" 'SELECT COUNT(*) FROM folders;')" = 1
          note_id="$(sqlite3 "$DB" "SELECT id FROM notes WHERE instr(document_json, '$ACCEPTANCE_TEXT') > 0 LIMIT 1;")"
          folder_id="$(sqlite3 "$DB" 'SELECT id FROM folders LIMIT 1;')"
          test -n "$note_id"
          test -n "$folder_id"
          test "$(sqlite3 "$DB" "SELECT name = 'Acceptance Folder' FROM folders WHERE id = '$folder_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT COUNT(*) = 2 FROM notes WHERE folder_id = '$folder_id' AND deleted_at IS NULL;")" = 1
          test "$(sqlite3 "$DB" "SELECT deleted_with_folder_id IS NULL FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT deleted_at IS NULL FROM folders WHERE id = '$folder_id';")" = 1
          revision="$(sqlite3 "$DB" "SELECT revision FROM notes WHERE id = '$note_id';")"
          test "$revision" -ge 2
          test "$(sqlite3 "$DB" "SELECT instr(document_json, '$ACCEPTANCE_TEXT') > 0 FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT instr(document_json, '\"heading\"') > 0 FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT instr(document_json, '\"image\"') > 0 FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT instr(document_json, '\"width\":') > 0 FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT instr(document_json, '\"height\":') > 0 FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT COUNT(*) >= 1 FROM attachments;")" = 1
          test "$(sqlite3 "$DB" "SELECT value = '$note_id' FROM app_meta WHERE key = 'last_note_id';")" = 1

          cp "$RUNNER_TEMP/flashnote-normal" ./flashnote
          REOPEN_LOG="$RUNNER_TEMP/note-roundtrip-reopen.log"
          ./flashnote >"$REOPEN_LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if grep -q "FLASHNOTE_NOTE_OPEN id=$note_id revision=$revision created=false" "$REOPEN_LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          grep -q "FLASHNOTE_NOTE_OPEN id=$note_id revision=$revision created=false" "$REOPEN_LOG"
          cleanup
          trap - EXIT

          mkdir -p internal/acceptanceprobe
          cat > internal/acceptanceprobe/main.go <<'PROBE'
          package main

          import (
            "context"
            "errors"
            "fmt"
            "os"
            "github.com/savior714/flashnote/internal/persistence"
          )

          func contains(summaries []persistence.NoteSummary, id string) bool {
            for _, summary := range summaries {
              if summary.ID == id { return true }
            }
            return false
          }

          func containsSearch(results []persistence.SearchResult, id string) bool {
            for _, result := range results {
              if result.ID == id { return true }
            }
            return false
          }

          func main() {
            ctx := context.Background()
            store, err := persistence.Open(ctx, os.Getenv("FLASHNOTE_ACCEPTANCE_DB"))
            if err != nil { panic(err) }
            defer store.Close()
            expectedID := os.Getenv("FLASHNOTE_EXPECTED_NOTE_ID")
            folderID := os.Getenv("FLASHNOTE_EXPECTED_FOLDER_ID")

            results, err := store.SearchNotes(ctx, "Flashnote")
            if err != nil || len(results) != 1 || results[0].ID != expectedID {
              panic(fmt.Sprintf("unexpected pre-trash search: %+v err=%v", results, err))
            }
            folderNotes, err := store.ListFolderNotes(ctx, folderID)
            if err != nil || len(folderNotes) != 2 || !contains(folderNotes, expectedID) {
              panic(fmt.Sprintf("unexpected pre-trash folder notes: %+v err=%v", folderNotes, err))
            }
            rootNotes, err := store.ListRootNotes(ctx)
            if err != nil || len(rootNotes) != 0 {
              panic(fmt.Sprintf("expected empty root after move: %+v err=%v", rootNotes, err))
            }

            if err := store.MoveNoteToTrash(ctx, expectedID); err != nil { panic(err) }
            folderNotes, err = store.ListFolderNotes(ctx, folderID)
            if err != nil || len(folderNotes) != 1 || contains(folderNotes, expectedID) {
              panic(fmt.Sprintf("trash leaked into folder list: %+v err=%v", folderNotes, err))
            }
            results, err = store.SearchNotes(ctx, "Flashnote")
            if err != nil || len(results) != 0 { panic(fmt.Sprintf("trash leaked into search: %+v err=%v", results, err)) }
            recent, err := store.SearchNotes(ctx, "")
            if err != nil || containsSearch(recent, expectedID) { panic(fmt.Sprintf("trash leaked into recent: %+v err=%v", recent, err)) }
            if _, err := store.OpenNote(ctx, expectedID); !errors.Is(err, persistence.ErrNoteNotFound) { panic(fmt.Sprintf("normal open allowed trash note: %v", err)) }
            trashed, err := store.OpenTrashNote(ctx, expectedID)
            if err != nil || trashed.ID != expectedID { panic(fmt.Sprintf("trash open failed: %+v err=%v", trashed, err)) }
            trashNotes, err := store.ListTrashNotes(ctx)
            if err != nil || len(trashNotes) != 1 || trashNotes[0].ID != expectedID { panic(fmt.Sprintf("trash list mismatch: %+v err=%v", trashNotes, err)) }

            if err := store.RestoreNote(ctx, expectedID); err != nil { panic(err) }
            folderNotes, err = store.ListFolderNotes(ctx, folderID)
            if err != nil || len(folderNotes) != 2 || !contains(folderNotes, expectedID) { panic(fmt.Sprintf("restored folder mismatch: %+v err=%v", folderNotes, err)) }
            results, err = store.SearchNotes(ctx, "Flashnote")
            if err != nil || len(results) != 1 || results[0].ID != expectedID { panic(fmt.Sprintf("restored search mismatch: %+v err=%v", results, err)) }

            moved, err := store.MoveFolderToTrash(ctx, folderID)
            if err != nil || moved != 2 { panic(fmt.Sprintf("MoveFolderToTrash moved=%d err=%v", moved, err)) }
            trashFolders, err := store.ListTrashFolders(ctx)
            if err != nil || len(trashFolders) != 1 || trashFolders[0].ID != folderID { panic(fmt.Sprintf("trash folders mismatch: %+v err=%v", trashFolders, err)) }
            grouped, err := store.ListTrashFolderNotes(ctx, folderID)
            if err != nil || len(grouped) != 2 || !contains(grouped, expectedID) { panic(fmt.Sprintf("recovery unit mismatch: %+v err=%v", grouped, err)) }
            trashNotes, err = store.ListTrashNotes(ctx)
            if err != nil || len(trashNotes) != 0 { panic(fmt.Sprintf("recovery unit flattened: %+v err=%v", trashNotes, err)) }
            if err := store.RestoreNote(ctx, expectedID); !errors.Is(err, persistence.ErrNotePartOfFolderTrash) { panic(fmt.Sprintf("child restore unexpectedly allowed: %v", err)) }
            results, err = store.SearchNotes(ctx, "Flashnote")
            if err != nil || len(results) != 0 { panic(fmt.Sprintf("folder trash leaked into search: %+v err=%v", results, err)) }

            restoredCount, err := store.RestoreFolder(ctx, folderID)
            if err != nil || restoredCount != 2 { panic(fmt.Sprintf("RestoreFolder restored=%d err=%v", restoredCount, err)) }
            folderNotes, err = store.ListFolderNotes(ctx, folderID)
            if err != nil || len(folderNotes) != 2 || !contains(folderNotes, expectedID) { panic(fmt.Sprintf("folder restore mismatch: %+v err=%v", folderNotes, err)) }
            results, err = store.SearchNotes(ctx, "Flashnote")
            if err != nil || len(results) != 1 || results[0].ID != expectedID { panic(fmt.Sprintf("folder restored search mismatch: %+v err=%v", results, err)) }

            standalone, err := store.CreateNote(ctx)
            if err != nil { panic(err) }
            if err := store.MoveNoteToTrash(ctx, standalone.ID); err != nil { panic(err) }
            emptyFolder, err := store.CreateFolder(ctx, "Acceptance Empty Trash Folder")
            if err != nil { panic(err) }
            if moved, err := store.MoveFolderToTrash(ctx, emptyFolder.ID); err != nil || moved != 0 { panic(fmt.Sprintf("empty folder trash moved=%d err=%v", moved, err)) }
            noteCount, folderCount, err := store.TrashCounts(ctx)
            if err != nil || noteCount != 1 || folderCount != 1 { panic(fmt.Sprintf("trash counts notes=%d folders=%d err=%v", noteCount, folderCount, err)) }
            deletedNotes, deletedFolders, err := store.EmptyTrash(ctx)
            if err != nil || deletedNotes != 1 || deletedFolders != 1 { panic(fmt.Sprintf("EmptyTrash notes=%d folders=%d err=%v", deletedNotes, deletedFolders, err)) }
            noteCount, folderCount, err = store.TrashCounts(ctx)
            if err != nil || noteCount != 0 || folderCount != 0 { panic(fmt.Sprintf("trash not empty notes=%d folders=%d err=%v", noteCount, folderCount, err)) }
            restored, err := store.OpenNote(ctx, expectedID)
            if err != nil || restored.ID != expectedID { panic(fmt.Sprintf("normal note lost after EmptyTrash: %+v err=%v", restored, err)) }
            if err := store.ValidateDocumentAttachments(ctx, restored.DocumentJSON); err != nil {
              panic(fmt.Sprintf("document attachment validation failed: %v", err))
            }

            fmt.Printf("trash_roundtrip id=%s folder=%s grouped=2 empty_trash=1/1 title=%q\n", expectedID, folderID, results[0].DisplayTitle)
          }
          PROBE
          FLASHNOTE_ACCEPTANCE_DB="$DB" FLASHNOTE_EXPECTED_NOTE_ID="$note_id" FLASHNOTE_EXPECTED_FOLDER_ID="$folder_id" \
            go run ./internal/acceptanceprobe | tee "$RUNNER_TEMP/search-roundtrip.log"
          rm -rf internal/acceptanceprobe

          test "$(sqlite3 "$DB" "SELECT COUNT(*) = 0 FROM app_meta WHERE key = 'search_index_version';")" = 1
          test "$(sqlite3 "$DB" "SELECT deleted_at IS NULL FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT deleted_with_folder_id IS NULL FROM notes WHERE id = '$note_id';")" = 1
          test "$(sqlite3 "$DB" "SELECT deleted_at IS NULL FROM folders WHERE id = '$folder_id';")" = 1

          cp "$LOG" "$RUNNER_TEMP/note-roundtrip-first.log.saved"
          cp "$REOPEN_LOG" "$RUNNER_TEMP/note-roundtrip-reopen.log.saved"

      - name: Verify source integrity
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            go.mod go.sum Taskfile.yml main.go app_service.go \
            internal/document internal/persistence \
            frontend/package.json frontend/pnpm-lock.yaml \
            frontend/src frontend/bindings

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scaffold-acceptance-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sqlite-runtime.json
            ${{ runner.temp }}/first-startup.log
            ${{ runner.temp }}/wails-dev.log.saved
            ${{ runner.temp }}/second-startup.log
            ${{ runner.temp }}/note-roundtrip-first.log
            ${{ runner.temp }}/note-roundtrip-first.log.saved
            ${{ runner.temp }}/note-roundtrip-reopen.log.saved
            ${{ runner.temp }}/search-roundtrip.log

      - name: Publish acceptance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="Native scaffold acceptance failed"
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description="Native scaffold acceptance passed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=native-scaffold-acceptance \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
