name: Native scaffold acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  macos-native-scaffold:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Publish pending acceptance status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=native-scaffold-acceptance \
            -f description="Native scaffold acceptance running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Toolchain diagnostics
        run: |
          set -euo pipefail
          go version
          node --version
          xcode-select -p
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails3" version

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          go mod tidy
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm add --save-dev --save-exact @types/node@24.13.3
          cd ..
          test -s go.sum
          test -s frontend/pnpm-lock.yaml

      - name: Generate bindings
        run: |
          set -euo pipefail
          wails3 generate bindings -clean=true -ts
          test -f frontend/bindings/github.com/savior714/flashnote/appservice.ts
          grep -q 'export function GetRuntimeInfo' frontend/bindings/github.com/savior714/flashnote/appservice.ts

      - name: Stage validated source candidate
        run: |
          set -euo pipefail
          python3 scripts/stage_native_acceptance_candidate.py
          gofmt -w app_service.go

      - name: Static checks
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -not -path './frontend/*' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
          go test ./...
          go vet ./...
          cd frontend
          pnpm check
          pnpm build
          cd ..
          wails3 task check

      - name: Wails build
        run: |
          set -euo pipefail
          wails3 build
          test -x ./flashnote

      - name: First native startup and frontend bridge
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          mkdir -p "$HOME"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG="$RUNNER_TEMP/flashnote-first.log"
          ./flashnote >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if [[ -f "$DB" ]] && grep -q FLASHNOTE_RUNTIME_READY "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          test -f "$DB"
          kill -0 "$pid"
          grep -q 'Handling request url=/assets/.*\.js' "$LOG"
          grep -q 'Handling request url=/assets/.*\.css' "$LOG"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          sqlite3 "$DB" 'SELECT version FROM schema_migrations ORDER BY version;'
          sqlite3 "$DB" 'SELECT name FROM sqlite_master WHERE type="table" ORDER BY name;'
          cp "$LOG" "$RUNNER_TEMP/first-startup.log"
          cleanup
          trap - EXIT

      - name: Wails dev smoke
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-dev-home"
          mkdir -p "$HOME"
          LOG="$RUNNER_TEMP/wails-dev.log"
          wails3 dev -config ./build/config.yml -port 9245 >"$LOG" 2>&1 &
          pid=$!
          cleanup() {
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in {1..90}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          curl --fail --silent --show-error http://127.0.0.1:9245/ | grep -q '<div id="app"></div>'
          cp "$LOG" "$RUNNER_TEMP/wails-dev.log.saved"
          cleanup
          trap - EXIT

      - name: SQLite runtime probe
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          mkdir -p internal/acceptanceprobe
          cat > internal/acceptanceprobe/main.go <<'EOF'
          package main

          import (
            "context"
            "encoding/json"
            "fmt"
            "github.com/savior714/flashnote/internal/appdata"
            "github.com/savior714/flashnote/internal/persistence"
          )

          func main() {
            path, err := appdata.DatabasePath()
            if err != nil { panic(err) }
            store, err := persistence.Open(context.Background(), path)
            if err != nil { panic(err) }
            defer store.Close()
            info, err := store.RuntimeInfo(context.Background())
            if err != nil { panic(err) }
            data, err := json.Marshal(info)
            if err != nil { panic(err) }
            fmt.Println(string(data))
          }
          EOF
          go run ./internal/acceptanceprobe | tee "$RUNNER_TEMP/sqlite-runtime.json"
          rm -rf internal/acceptanceprobe

      - name: Second native startup
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/flashnote-home"
          DB="$HOME/Library/Application Support/Flashnote/flashnote.db"
          LOG="$RUNNER_TEMP/flashnote-second.log"
          before="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')"
          ./flashnote >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in {1..30}; do
            if grep -q FLASHNOTE_RUNTIME_READY "$LOG"; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          kill -0 "$pid"
          grep -q FLASHNOTE_RUNTIME_READY "$LOG"
          after="$(sqlite3 "$DB" 'SELECT COUNT(*) FROM schema_migrations;')"
          test "$before" = "$after"
          test "$after" = 1
          cp "$LOG" "$RUNNER_TEMP/second-startup.log"
          cleanup
          trap - EXIT

      - name: Record candidate evidence
        if: always()
        run: |
          git diff -- app_service.go Taskfile.yml frontend/src/App.svelte frontend/package.json frontend/pnpm-lock.yaml go.sum > "$RUNNER_TEMP/candidate.patch" || true
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "go=$(go version 2>/dev/null || true)"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "pnpm=$(pnpm --version 2>/dev/null || true)"
            echo "wails=$($(go env GOPATH)/bin/wails3 version 2>/dev/null || true)"
            echo "go_sum_sha256=$(shasum -a 256 go.sum 2>/dev/null | awk '{print $1}' || true)"
            echo "pnpm_lock_sha256=$(shasum -a 256 frontend/pnpm-lock.yaml 2>/dev/null | awk '{print $1}' || true)"
          } | tee "$RUNNER_TEMP/acceptance-evidence.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scaffold-acceptance-${{ github.sha }}
          if-no-files-found: warn
          path: |
            app_service.go
            Taskfile.yml
            go.sum
            frontend/src/App.svelte
            frontend/package.json
            frontend/pnpm-lock.yaml
            frontend/bindings
            ${{ runner.temp }}/acceptance-evidence.txt
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/sqlite-runtime.json
            ${{ runner.temp }}/first-startup.log
            ${{ runner.temp }}/wails-dev.log.saved
            ${{ runner.temp }}/second-startup.log

      - name: Publish acceptance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="Native scaffold acceptance failed"
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description="Native scaffold acceptance passed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=native-scaffold-acceptance \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
