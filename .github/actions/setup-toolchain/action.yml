name: Flashnote toolchain
description: Installs the pinned Go, Node, pnpm and Wails v3 toolchain used by release packaging

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'
        cache: false

    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Install pnpm and the pinned Wails v3 CLI
      shell: bash
      run: |
        set -euo pipefail
        corepack enable
        corepack prepare pnpm@11.21.0 --activate
        go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
        gobin="$(go env GOPATH)/bin"
        echo "$gobin" >> "$GITHUB_PATH"
        "$gobin/wails3" version
        pnpm --version
